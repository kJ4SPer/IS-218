<!DOCTYPE html>
<html lang="no" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beredskapskart</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="position-relative vh-100 vw-100 overflow-hidden hud-bg">

    <div id="loader" class="position-absolute w-100 h-100 hud-bg bg-opacity-100 d-flex justify-content-center align-items-center" style="z-index: 1050;">
        <div class="spinner-border text-danger" role="status" style="width: 3rem; height: 3rem; border-width: 0.25em;">
            <span class="visually-hidden">Laster system...</span>
        </div>
    </div>

    <div id="map" class="w-100 h-100"></div>

    <aside id="sidebar" class="hud-panel position-absolute m-3" style="width: 280px; z-index: 1000; top: 0; left: 0;">
        <div class="p-3">
            <h2 class="h6 fw-bold mb-0 text-uppercase tracking-wide text-danger">Beredskapskart</h2>
            <p class="small mb-3 text-muted font-mono">SYS.LOC // KRISTIANSAND</p>

            <div class="mb-4">
                <div class="form-check form-switch mb-2 custom-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="toggle-tilfluktsrom" checked>
                    <label class="form-check-label small text-light text-uppercase font-mono" for="toggle-tilfluktsrom">Tilfluktsrom</label>
                </div>
                <div class="form-check form-switch mb-2 custom-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="toggle-ressurser" checked>
                    <label class="form-check-label small text-light text-uppercase font-mono" for="toggle-ressurser">Ressurser</label>
                </div>
                <div class="form-check form-switch mb-1 custom-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="toggle-flomsone" checked>
                    <label class="form-check-label small text-light text-uppercase font-mono" for="toggle-flomsone">Flomsone (200y)</label>
                    <div id="flom-info" class="small text-danger mt-1 fw-bold font-mono blink-text" style="display: none;">
                        [!] KRITISK: OBJEKTER I FLOMSONE
                    </div>
                </div>
            </div>

            <button id="my-location-btn" class="btn hud-btn w-100 d-flex align-items-center justify-content-center font-mono">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-crosshair me-2" viewBox="0 0 16 16">
                    <path d="M8.5.5a.5.5 0 0 0-1 0v.518A7 7 0 0 0 1.018 7.5H.5a.5.5 0 0 0 0 1h.518A7 7 0 0 0 7.5 14.982v.518a.5.5 0 0 0 1 0v-.518A7 7 0 0 0 14.982 8.5h.518a.5.5 0 0 0 0-1h-.518A7 7 0 0 0 8.5 1.018zm-6.48 7A6 6 0 0 1 7.5 2.02v.48a.5.5 0 0 0 1 0v-.48a6 6 0 0 1 5.48 5.48h-.48a.5.5 0 0 0 0 1h.48a6 6 0 0 1-5.48 5.48v-.48a.5.5 0 0 0-1 0v.48A6 6 0 0 1 2.02 8.5h.48a.5.5 0 0 0 0-1z"/>
                </svg>
                POS. TRACKING
            </button>
        </div>
    </aside>

    <div id="legend" class="hud-panel position-absolute m-3" style="width: auto; z-index: 1000; bottom: 30px; left: 0;">
        <div class="p-3">
            <h6 class="text-uppercase text-muted small fw-bold mb-3 border-bottom border-secondary pb-2 font-mono">Tegnforklaring</h6>
            
            <div class="d-flex align-items-center mb-2">
                <span class="legend-icon" style="background-color: #ed8936; width: 12px; height: 12px;"></span>
                <span class="small ms-2 text-light font-mono">TR (&lt; 200)</span>
            </div>
            <div class="d-flex align-items-center mb-2">
                <span class="legend-icon" style="background-color: #e53e3e; width: 12px; height: 12px;"></span>
                <span class="small ms-2 text-light font-mono">TR (&gt; 200)</span>
            </div>
            <div class="d-flex align-items-center mb-2">
                <span class="legend-icon" style="background-color: #4fd1c5; width: 12px; height: 12px;"></span>
                <span class="small ms-2 text-light font-mono">Ressurs</span>
            </div>
            <div class="d-flex align-items-center">
                <span class="legend-icon" style="background-color: rgba(229, 62, 62, 0.2); border: 1px solid #e53e3e; width: 12px; height: 12px;"></span>
                <span class="small ms-2 text-light font-mono">Flomsone</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
